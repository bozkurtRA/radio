<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#080910" />
    </linearGradient>

    <!-- Vibrant Gradient: Violet to Cyan to Sunset Orange -->
    <linearGradient id="radioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Subtle ambient inner light rings -->
  <circle cx="256" cy="245" r="190" fill="none" stroke="rgba(139,92,246,0.12)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="245" r="145" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="2" stroke-dasharray="10 6"/>

  <g filter="url(#softShadow)">
    <!-- Central Sound Waves / Equalizer & Radio Signals -->
    
    <!-- Outer Radio Broadcast Waves (Left & Right) -->
    <!-- Left Waves -->
    <path d="M 175 160 A 110 110 0 0 0 175 330" fill="none" stroke="url(#radioGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M 135 125 A 165 165 0 0 0 135 365" fill="none" stroke="url(#radioGrad)" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    
    <!-- Right Waves -->
    <path d="M 337 160 A 110 110 0 0 1 337 330" fill="none" stroke="url(#radioGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M 377 125 A 165 165 0 0 1 377 365" fill="none" stroke="url(#radioGrad)" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

    <!-- Central Dynamic Equalizer Pulsing Core -->
    <!-- Bar 1 (Outer Left) -->
    <rect x="206" y="215" width="12" height="60" rx="6" fill="url(#accentCyan)" filter="url(#neonGlow)"/>
    <!-- Bar 2 (Mid Left) -->
    <rect x="226" y="175" width="12" height="140" rx="6" fill="url(#accentCyan)"/>
    <!-- Bar 3 (Center High Tower) -->
    <rect x="250" y="130" width="12" height="230" rx="6" fill="url(#radioGrad)" filter="url(#neonGlow)"/>
    <!-- Bar 4 (Mid Right) -->
    <rect x="274" y="175" width="12" height="140" rx="6" fill="url(#accentOrange)"/>
    <!-- Bar 5 (Outer Right) -->
    <rect x="294" y="215" width="12" height="60" rx="6" fill="url(#accentOrange)" filter="url(#neonGlow)"/>

    <!-- Radio Transmitter Glowing Orb at Top Center -->
    <circle cx="256" cy="115" r="10" fill="#FF9966" filter="url(#neonGlow)"/>
    <circle cx="256" cy="115" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Sleek Brand Typography at bottom of icon -->
  <g transform="translate(256, 428)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="3" fill="#FFFFFF">
      r<tspan fill="url(#accentOrange)">A</tspan><tspan fill="#F3F4F6">dio</tspan>
    </text>
  </g>
</svg>

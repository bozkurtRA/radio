<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="textOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Symbol Mark -->
  <g transform="translate(10, 8)">
    <!-- Radio Waves Left & Right -->
    <path d="M 22 24 A 20 20 0 0 0 22 46" fill="none" stroke="url(#logoWaveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 15 17 A 30 30 0 0 0 15 53" fill="none" stroke="url(#logoWaveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <path d="M 48 24 A 20 20 0 0 1 48 46" fill="none" stroke="url(#logoWaveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 55 17 A 30 30 0 0 1 55 53" fill="none" stroke="url(#logoWaveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Central Equalizer Bars -->
    <rect x="27" y="27" width="3" height="16" rx="1.5" fill="#06B6D4" />
    <rect x="32" y="20" width="3" height="30" rx="1.5" fill="#3B82F6" />
    <rect x="37" y="14" width="3.5" height="42" rx="1.75" fill="url(#logoWaveGrad)" filter="url(#logoGlow)" />
    <rect x="42" y="22" width="3" height="26" rx="1.5" fill="#F97316" />

    <!-- Antenna beacon -->
    <circle cx="38.75" cy="10" r="2.5" fill="#FF9966" filter="url(#logoGlow)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(90, 48)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="900" font-size="40" letter-spacing="0.5" fill="#FFFFFF">
      r<tspan fill="url(#textOrange)">A</tspan><tspan fill="#F8FAFC">dio</tspan>
    </text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(92, 66)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="10.5" letter-spacing="3" fill="#94A3B8" opacity="0.85">
      MOBİL CANLI RADYO
    </text>
  </g>
</svg>

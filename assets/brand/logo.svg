<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="45%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <linearGradient id="textOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Symbol Mark -->
  <g transform="translate(10, 8)">
    <!-- Radio Waves Left & Right -->
    <path d="M 22 24 A 20 20 0 0 0 22 46" fill="none" stroke="url(#logoWaveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M 14 17 A 30 30 0 0 0 14 53" fill="none" stroke="url(#logoWaveGrad)" stroke-width="2.8" stroke-linecap="round" opacity="0.6"/>

    <path d="M 48 24 A 20 20 0 0 1 48 46" fill="none" stroke="url(#logoWaveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M 56 17 A 30 30 0 0 1 56 53" fill="none" stroke="url(#logoWaveGrad)" stroke-width="2.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Central Equalizer Bars -->
    <rect x="26" y="26" width="3.5" height="18" rx="1.75" fill="#06B6D4" />
    <rect x="32" y="19" width="3.5" height="32" rx="1.75" fill="#3B82F6" />
    <rect x="38" y="13" width="4" height="44" rx="2" fill="url(#logoWaveGrad)" filter="url(#logoGlow)" />
    <rect x="44" y="21" width="3.5" height="28" rx="1.75" fill="#F97316" />

    <!-- Antenna beacon -->
    <circle cx="40" cy="9" r="3" fill="#FF9966" filter="url(#logoGlow)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(90, 48)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="900" font-size="42" letter-spacing="0.5" fill="#FFFFFF">
      r<tspan fill="url(#textOrange)">A</tspan><tspan fill="#FFFFFF">dio</tspan>
    </text>
  </g>

  <!-- Tagline / Subtitle -->
  <g transform="translate(92, 67)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="700" font-size="11.5" letter-spacing="2.5" fill="#CBD5E1">
      MOBİL CANLI RADYO
    </text>
  </g>
</svg>
